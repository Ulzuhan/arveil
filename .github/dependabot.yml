# Every action in .github/workflows and .github/actions is pinned to a full commit SHA, with its
# version in a comment. Dependabot keeps those pins current: at most one
# grouped pull request a week, which goes through the same required checks
# as any other change. Security updates for the language ecosystems are
# enabled in the repository settings and need no entry here.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
