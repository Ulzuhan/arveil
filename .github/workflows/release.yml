# CLI/relay release builds (M3.5). Runs on v* tags, produces binaries with
# SHA256SUMS-cli-relay.txt and signed build provenance, so somebody who did not
# build it can check where it came from.
# Flutter packages use clients-v* tags and SHA256SUMS-clients.txt.
#
# What this does not do: platform code signing. There is no Apple
# notarization and no Windows Authenticode certificate, so macOS and Windows
# will still warn on first run. That is stated here rather than implied away.
#
# Nothing is built, attested or published until a maintainer approves the
# run in the `release` environment, which only accepts v* tags and main (for
# a manual run). A tag pushed by mistake, or by a tool holding a
# maintainer's token, stops at that approval.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approve:
    name: Maintainer approval
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - name: Record what was approved
        run: echo "Approved ${GITHUB_REF} at ${GITHUB_SHA}"

  build:
    name: ${{ matrix.target }}
    needs: approve
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            goos: linux
            goarch: amd64
          - os: macos-latest
            target: macos-aarch64
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum

      - name: Install toolchain from rust-toolchain.toml
        working-directory: core
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core

      - name: Build the relay
        working-directory: relay
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X github.com/Ulzuhan/arveil/relay/internal/version.Revision=${GITHUB_SHA}" \
            -o "dist/arveil-relay" ./cmd/arveil-relay

      - name: Build the client
        working-directory: core
        env:
          ARVEIL_REVISION: ${{ github.sha }}
        run: cargo build --release -p arveil-cli

      - name: Collect and check the artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp relay/dist/arveil-relay "dist/arveil-relay-${{ matrix.target }}"
          cp core/target/release/arveil "dist/arveil-${{ matrix.target }}"
          # The binaries must report the revision they were built from.
          if [ "${{ matrix.goos }}" = "$(go env GOHOSTOS)" ]; then
            "dist/arveil-relay-${{ matrix.target }}" -version | tee /dev/stderr | grep -q "${GITHUB_SHA}"
          fi
          "dist/arveil-${{ matrix.target }}" version | tee /dev/stderr | grep -q "${GITHUB_SHA}"
          cd dist && shasum -a 256 arveil-* > "SHA256SUMS-${{ matrix.target }}.txt"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/arveil-relay-${{ matrix.target }}
            dist/arveil-${{ matrix.target }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arveil-${{ matrix.target }}
          path: dist/*

  publish:
    name: Attach the artifacts to the release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: arveil-*
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_binaries.sh dist
