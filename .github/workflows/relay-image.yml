# Versioned relay images for Linux x86-64 and ARM64 (M3b.5).
#
# A pull request that touches the relay builds both architectures and checks
# that each binary reports the commit it came from, without publishing
# anything. Only a v* release tag pushes the images to GitHub Container
# Registry, tagged with the version and the full commit, with signed build
# provenance. Nothing runs on a schedule or by hand. On a tag, a maintainer
# approves the run in the `release` environment before anything is built or
# pushed; pull requests need no approval because they publish nothing.
name: Relay image

on:
  pull_request:
    paths:
      - "relay/**"
      - ".github/workflows/relay-image.yml"
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  approve:
    name: Maintainer approval
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - name: Record what was approved
        run: echo "Approved ${GITHUB_REF} at ${GITHUB_SHA}"

  image:
    name: Relay image (linux/amd64, linux/arm64)
    needs: approve
    # A pull request skips the approval and still builds; a tag builds only
    # once the approval succeeded.
    if: >-
      ${{ !cancelled() && (needs.approve.result == 'success' ||
      (needs.approve.result == 'skipped' && github.event_name == 'pull_request')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Registry names must be lower case; the account name is not.
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/arveil-relay" >> "$GITHUB_OUTPUT"

      - name: Each architecture reports its commit
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            docker buildx build --platform "$platform" --load \
              --build-arg "REVISION=${GITHUB_SHA}" \
              -f relay/Dockerfile -t arveil-relay:check .
            docker run --rm --platform "$platform" arveil-relay:check -version \
              | tee /dev/stderr | grep -q "${GITHUB_SHA}"
          done

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build both architectures (and publish on a release tag)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: REVISION=${{ github.sha }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest build provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
