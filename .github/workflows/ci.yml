name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: Documentation (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install "mkdocs-material~=9.7"
      - run: mkdocs build --strict
      - name: Release publication regression checks
        run: python3 -m unittest discover -s scripts -p 'test_release_publication.py'

  relay:
    name: Go relay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Build
        working-directory: relay
        run: go build ./...
      - name: Vet
        working-directory: relay
        run: go vet ./...
      - name: Test
        working-directory: relay
        run: go test -race ./...

  core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain from rust-toolchain.toml
        working-directory: core
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - name: Format
        working-directory: core
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: core
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        working-directory: core
        run: cargo test --workspace --locked

  bridge-macos:
    name: Flutter bridge (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - name: Install toolchain from rust-toolchain.toml
        working-directory: core
        run: rustup show
      # The native build runs cargo from its own place and does not read the
      # workspace toolchain file, so the pinned version has to be the
      # default one here.
      - name: Make the pinned toolchain the default
        run: rustup default "$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' core/rust-toolchain.toml | head -1)"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - name: Resolve packages
        working-directory: clients/flutter
        run: flutter pub get
      # The generated localizations are committed; they must match the ARBs.
      - name: Localizations up to date
        working-directory: clients/flutter
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n
          test ! -s build/l10n_untranslated.json || grep -qx '{}' build/l10n_untranslated.json
      - name: Analyze
        working-directory: clients/flutter
        run: flutter analyze
      - name: Widget tests
        working-directory: clients/flutter
        run: flutter test test
      - name: Native conversations and unread-state acceptance
        run: python3 scripts/test_client_conversations.py --device macos
      - name: Package privacy regression checks
        run: python3 -m unittest discover -s scripts -p 'test_package_clients.py'
      # Build the same ad-hoc package a maintainer produces. This also checks
      # the signed bundle, architecture and decompressed artifact contents.
      - name: Verify macOS release packaging
        run: python3 scripts/package_clients.py build macos

  bridge-android:
    name: Flutter bridge (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - name: Install toolchain from rust-toolchain.toml
        working-directory: core
        run: rustup show
      - name: Make the pinned toolchain the default
        run: rustup default "$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' core/rust-toolchain.toml | head -1)"
      - name: Add Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - name: Resolve packages
        working-directory: clients/flutter
        run: flutter pub get
      # This disposable CI key only exercises the signing/package checks.
      # It is never used for user downloads, and no APK is uploaded here.
      - name: Verify Android release packaging
        run: |
          python3 scripts/package_clients.py init-android-key
          python3 scripts/package_clients.py build android --signing-config .local/signing/android-signing.json
      # Packaging builds in an isolated source tree; prepare this checkout too.
      - name: Android attachment input tests
        working-directory: clients/flutter
        run: |
          flutter build apk --debug --config-only
          cd android
          # A packaging daemon may retain the now-deleted temporary SDK alias.
          ./gradlew --no-daemon app:testDebugUnitTest -Ptarget-platform=android-arm64 -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false

  mls-spike:
    name: MLS spike (M0.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain from rust-toolchain.toml
        working-directory: spikes/mls
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: spikes/mls
      - name: Test
        working-directory: spikes/mls
        # --locked so a stale lock fails here instead of silently resolving
        # a dependency set nobody has run.
        run: cargo test --locked

  interop:
    name: Channel interop (Go relay vs Rust client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Install toolchain from rust-toolchain.toml
        working-directory: core
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - run: ./scripts/interop.sh

  demo:
    name: Phase 0 demo (MLS chat, relay restart, crash injection, inventory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Install toolchain from rust-toolchain.toml
        working-directory: core
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - run: sudo apt-get install -y sqlite3
      - run: ./scripts/demo.sh

  q3-capture:
    name: Q3 capture behind a TLS-terminating proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Install toolchain from rust-toolchain.toml
        working-directory: core
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - run: ./scripts/q3-capture.sh

  phase1:
    name: Phase 1 acceptance (offline outbox, groups, TTL, endpoints, attachments)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Install toolchain from rust-toolchain.toml
        working-directory: core
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - run: ./scripts/phase1.sh
      - name: Acceptance with frequent cleanup
        env:
          ARVEIL_P1_SWEEP_INTERVAL: 1ms
        run: ./scripts/phase1.sh

  phase2:
    name: Phase 2 acceptance (linking, multi-device, revocation, succession, recovery, at rest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Install toolchain from rust-toolchain.toml
        working-directory: core
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - run: ./scripts/phase2.sh

  phase3:
    name: Phase 3 acceptance (pairing, contacts, resumable transfers, push hint, builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Install toolchain from rust-toolchain.toml
        working-directory: core
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - run: ./scripts/phase3.sh

  phase4:
    name: Phase 4 acceptance (packaging, limits, health, TLS, backups, client gaps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Install toolchain from rust-toolchain.toml
        working-directory: core
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - run: ./scripts/phase4.sh
  phase3b:
    name: Phase 3b acceptance (repeatable mailbox creation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Install toolchain from rust-toolchain.toml
        working-directory: core
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - run: ./scripts/phase3b.sh
