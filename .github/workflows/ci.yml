name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: Documentation (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mkdocs-material~=9.7"
      - run: mkdocs build --strict

  relay:
    name: Go relay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Build
        working-directory: relay
        run: go build ./...
      - name: Vet
        working-directory: relay
        run: go vet ./...
      - name: Test
        working-directory: relay
        run: go test -race ./...

  core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        working-directory: core
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Format
        working-directory: core
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: core
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        working-directory: core
        run: cargo test --workspace --locked

  bridge-macos:
    name: Flutter bridge (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - name: Install toolchain from rust-toolchain.toml
        working-directory: core
        run: rustup show
      # The native build runs cargo from its own place and does not read the
      # workspace toolchain file, so the pinned version has to be the
      # default one here.
      - name: Make the pinned toolchain the default
        run: rustup default "$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' core/rust-toolchain.toml | head -1)"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Resolve packages
        working-directory: clients/flutter
        run: flutter pub get
      - name: Analyze
        working-directory: clients/flutter
        run: flutter analyze
      - name: Widget tests
        working-directory: clients/flutter
        run: flutter test test
      # The application links the Rust adapter, so this builds SQLCipher and
      # its vendored OpenSSL for the host as well.
      - name: Build
        working-directory: clients/flutter
        run: flutter build macos --debug

  bridge-android:
    name: Flutter bridge (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - name: Install toolchain from rust-toolchain.toml
        working-directory: core
        run: rustup show
      - name: Make the pinned toolchain the default
        run: rustup default "$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' core/rust-toolchain.toml | head -1)"
      - name: Add Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Resolve packages
        working-directory: clients/flutter
        run: flutter pub get
      # One ABI keeps the vendored OpenSSL build to a single pass; the
      # release matrix is a packaging concern for M3b.5.
      - name: Build
        working-directory: clients/flutter
        run: flutter build apk --debug --target-platform android-arm64

  mls-spike:
    name: MLS spike (M0.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        working-directory: spikes/mls
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/mls
      - name: Test
        working-directory: spikes/mls
        # --locked so a stale lock fails here instead of silently resolving
        # a dependency set nobody has run.
        run: cargo test --locked

  interop:
    name: Channel interop (Go relay vs Rust client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Install toolchain from rust-toolchain.toml
        working-directory: core
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: ./scripts/interop.sh

  demo:
    name: Phase 0 demo (MLS chat, relay restart, crash injection, inventory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Install toolchain from rust-toolchain.toml
        working-directory: core
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: sudo apt-get install -y sqlite3
      - run: ./scripts/demo.sh

  q3-capture:
    name: Q3 capture behind a TLS-terminating proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Install toolchain from rust-toolchain.toml
        working-directory: core
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: ./scripts/q3-capture.sh

  phase1:
    name: Phase 1 acceptance (offline outbox, groups, TTL, endpoints, attachments)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Install toolchain from rust-toolchain.toml
        working-directory: core
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: ./scripts/phase1.sh

  phase2:
    name: Phase 2 acceptance (linking, multi-device, revocation, succession, recovery, at rest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Install toolchain from rust-toolchain.toml
        working-directory: core
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: ./scripts/phase2.sh

  phase3:
    name: Phase 3 acceptance (pairing, contacts, resumable transfers, push hint, builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Install toolchain from rust-toolchain.toml
        working-directory: core
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: ./scripts/phase3.sh

  phase4:
    name: Phase 4 acceptance (packaging, limits, health, TLS, backups, client gaps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Install toolchain from rust-toolchain.toml
        working-directory: core
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: ./scripts/phase4.sh
