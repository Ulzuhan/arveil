[workspace]
resolver = "2"
members = ["crates/arveil-core", "crates/arveil-app", "crates/arveil-cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/Ulzuhan/arveil"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mls_build_async)'] }

[workspace.lints.clippy]
all = "warn"
