[package]
name = "arveil-core"
description = "Arveil client core: identity, MLS, encrypted storage, delivery and recovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["recovery"]
# The identity kit and history archive (M2.5). Optional so that consumers
# which only need the MLS engine (the M0.5 spike) do not pull `age` and its
# post-quantum dependency tree, which conflicts with OpenMLS's `kem`.
recovery = ["dep:age"]

[dependencies]
aes-gcm = "0.10"
age = { version = "0.12.1", optional = true }
ciborium = "0.2"
ed25519-dalek = "3"
getrandom = "0.4.3"
hpke-rs = "0.7"
hpke-rs-crypto = "0.7"
hpke-rs-rust-crypto = "0.7"
maybe-async = "0.2"
mls-rs = "0.56"
mls-rs-codec = "0.7"
mls-rs-core = "0.27"
mls-rs-crypto-rustcrypto = "0.22"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
sha2 = "0.11.0"
snow = "0.10"
thiserror = "2.0.20"
zeroize = "1.9.0"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
serde_bytes = "0.11.19"
