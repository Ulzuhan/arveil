[package]
name = "arveil-cli"
description = "Arveil command-line client used for Phase 0 demos and tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "arveil"
path = "src/main.rs"

[dependencies]
arveil-core = { path = "../arveil-core" }
ed25519-dalek = "3"
futures-util = "0.3.34"
hex = "0.4.3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tokio-tungstenite = "0.30"

[lints]
workspace = true
