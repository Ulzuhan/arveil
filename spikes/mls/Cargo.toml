[package]
name = "mls-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "Throwaway Phase 0 spike: OpenMLS vs mls-rs against Q1 (transactional persistence) and Q2 (inspect commit before merge)"

[features]
extensions-draft = []
virtual-clients-draft = []
test-utils = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mls_build_async)'] }

[dependencies]
arveil-core = { path = "../../core/crates/arveil-core" }
maybe-async = "0.2"
mls-rs = "0.56"
mls-rs-core = "0.27"
mls-rs-crypto-rustcrypto = "0.22"
openmls = "0.9"
openmls_basic_credential = "0.6.0"
openmls_rust_crypto = "0.6"
openmls_traits = "0.6"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.20"
zeroize = "1.9.0"

[workspace]
